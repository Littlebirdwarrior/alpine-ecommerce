<!DOCTYPE html>
<html lang="fr">
    <head>
        <head>
            <!-- Meta tags pour le responsive et l'encodage -->
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Exo-facile Alpine</title>
            <!-- Chargement des scripts et styles -->
            <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        </head>
         <body>
            <main>
                <h1>Exercice facile avec Alpine.js</h1>
                <p>Utilisez Alpine.js pour créer une simple liste de tâches.</p>
                
                <section>
                    <h2>Toggle simple</h2>
                    <!-- x-data : crée un composant réactif -->
                    <div x-data="{ open: false }">
                        <!-- x-on:click : ajoute un écouteur d'événement -->
                        <button @click="open = !open">Afficher/Masquer</button>
                        <!-- x-show : affiche ou masque un élément -->
                        <p x-show="open">Coucou, je m'affiche</p>
                    </div>
                </section>
                <section>
                    <h2>Formulaire réactif</h2>
                    <!-- J'initie mes données -->
                    <div x-data="{ name: '', showMessage: false}">
                        <!-- @submit.prevent : empêche le comportement par défaut du formulaire -->
                        <form @submit.prevent="showMessage = true">
                            <label for="name"> Donnez votre nom :</label>
                            <!-- x-model : lie un élément model à un élément input -->
                            <input type="text" id="name" name="name" x-model="name">
                            <button type="submit">Envoyer</button>
                        </form>
                        <p x-show="showMessage">
                            Bonjour, <span x-text="name"></span> !
                        </p>
                    </div>
                </section>
                <section>
                    <h2>Liste dropdown</h2>
                    <!-- J'initie mes données avec un tableau pour utiliser un for -->
                    <div x-data="{ 
                            options: ['Option 1', 'Option 2', 'Option 3'], 
                            option: '', 
                            showOptions: false 
                        }">
                        <!-- au click on inverse la valeur de showOptions-->
                        <button @click="showOptions = !showOptions">Choisir une option</button>

                        <ul x-show="showOptions" x-transition @click.away="showOptions = false">

                            <template x-for="item in options" :key="item">
                                <li @click="option = item; showOptions = false" x-text="item"></li>
                            </template>
                        </ul>
                        <p>Vous avez sélectionné : <span x-text="option"></span></p>
                    </div>
                </section>
                <section>
                    <h2>Onglet qui affiche un contenu différent</h2>
                    <div x-data="{ 
                            // Tableau d'objets, chaque onglet a un id et une couleur associée
                            tabs: [
                                { id: 1, color: 'lightcoral' },
                                { id: 2, color: 'lightblue' }
                            ],
                            activeTab: 1 // Onglet actif par défaut
                        }">
                        <template x-for="tab in tabs" :key="tab.id">
                            <button @click="activeTab = tab.id">Onglet <span x-text="tab.id"></button>
                        </template>
                        <!-- x-show permet aussi de vérifier une condition tout en gardant l'éléments dans le DOM-->
                        <template x-for="tab in tabs" :key="tab.id">                     
                            <div 
                                x-show="activeTab === tab.id"
                                x-transition
                                :style="width:fit-content;">
                                <p :style="'width:fit-content; background-color:' + tab.color + '; padding:10px; margin-top:10px;'">
                                    Je suis le contenu <span x-text="tab.id">
                                </p>
                            </div>
                        </template>
                    </div>
                </section>
                <section>
                    <h2>Liste des tâches</h2>
                    <!-- j'initialise un tableau vide, et une methode pour y ajouter des données-->
                    <form x-data="{ tasks: [], newTask: '' }" @submit.prevent="tasks.push(newTask); newTask = ''">
                        <input type="text" x-model="newTask" placeholder="Ajouter une tâche">
                        <button type="submit">Ajouter</button>
                        <ul>
                            <template x-for="(task, index) in tasks" :key="task">
                                <li>
                                    <span x-text="task"></span>
                                    <!-- splice (index, 1), supprime 1 élément du tableau à la position index-->
                                    <button @click="tasks.splice(index, 1)" style="margin-left:8px; color:red; cursor:pointer;">✗</button>
                                </li>
                            </template>
                        </ul>
                </section>
            </main>
        </body>
    </head>
</html>
